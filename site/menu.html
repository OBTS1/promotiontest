<title>動画ツール</title>
<style>
  /* ホーム画面アプリの入口。2 つのツールを大きなカードで並べるだけの一画面 */
  :root {
    --bg: #eceff2; --panel: #ffffff; --ink: #161b22; --muted: #5d6673; --line: #d4dae1; --accent: #1f5fd1; --ok: #1d7a46;
    --font-body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0f1318; --panel: #171c23; --ink: #e5e9ee; --muted: #9aa4b1; --line: #2a313b; --accent: #6b9cff; --ok: #6fd39a; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0f1318; --panel: #171c23; --ink: #e5e9ee; --muted: #9aa4b1; --line: #2a313b; --accent: #6b9cff; --ok: #6fd39a; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
  .wrap { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 40px; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0 0 6px; font-size: 1.6rem; }
  .tool { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); color: inherit; text-decoration: none; }
  .tool:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .tool .mark { flex: none; width: 52px; height: 52px; border-radius: 12px; background: var(--accent); display: grid; place-items: center; }
  .tool b { display: block; font-size: 1.1rem; color: var(--ink); }
  .tool span { color: var(--muted); font-size: 0.88rem; }
  .note { margin: 6px 0 0; color: var(--muted); font-size: 0.84rem; }
  .note.ok { color: var(--ok); }
</style>
<div class="wrap">
  <h1>動画ツール</h1>
  <a class="tool" href="clip-editor/">
    <span class="mark" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16M3 9h5M3 15h5M16 9h5M16 15h5"/></svg></span>
    <span><b>クリップつなぎ</b><span>カット・分割・並べ替えしてつなげて保存</span></span>
  </a>
  <a class="tool" href="mute-video/">
    <span class="mark" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg></span>
    <span><b>ミュート動画保存</b><span>音声だけを消して保存し直す</span></span>
  </a>
  <p class="note" id="offline">オフラインで使う準備をしています…</p>
  <p class="note">ホーム画面に置くには、Safari で共有ボタン →「ホーム画面に追加」。動画はどこにも送信されません。</p>
</div>
<script>
  (function () {
    var el = document.getElementById('offline');
    if (!('serviceWorker' in navigator)) { el.textContent = 'このブラウザはオフライン利用に対応していません。'; return; }
    navigator.serviceWorker.ready.then(function () {
      el.textContent = 'オフラインでも使えます（一度開いたので、この端末に保存済み）。';
      el.className = 'note ok';
    });
  })();
</script>
