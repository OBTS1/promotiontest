<title>クリップつなぎ</title>
<style>
  /* 編集台：上にプレビューとトリム、下に並び順のタイムライン、最後に書き出し。iPhone 縦持ち前提の一列 */
  :root {
    --bg: #eceff2;
    --panel: #ffffff;
    --ink: #161b22;
    --muted: #5d6673;
    --line: #d4dae1;
    --accent: #1f5fd1;
    --accent-ink: #ffffff;
    --keep: #1f5fd1;
    --keep-soft: #dde7fa;
    --trim: #c9d0d8;
    --danger: #b3261e;
    --ok: #1d7a46;
    --font-body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1318; --panel: #171c23; --ink: #e5e9ee; --muted: #9aa4b1; --line: #2a313b;
      --accent: #6b9cff; --accent-ink: #0c1220; --keep: #6b9cff; --keep-soft: #1c2a45; --trim: #2e3642;
      --danger: #ff8a80; --ok: #6fd39a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1318; --panel: #171c23; --ink: #e5e9ee; --muted: #9aa4b1; --line: #2a313b;
    --accent: #6b9cff; --accent-ink: #0c1220; --keep: #6b9cff; --keep-soft: #1c2a45; --trim: #2e3642;
    --danger: #ff8a80; --ok: #6fd39a; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
  .wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font-size: 1.5rem; text-wrap: balance; }
  .lead { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
  h2 { margin: 0; font-size: 0.95rem; font-weight: 700; }
  .tc { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .spread { justify-content: space-between; }

  button, .filebtn {
    appearance: none; font: inherit; font-size: 0.92rem; font-weight: 600; cursor: pointer;
    border-radius: 10px; min-height: 44px; padding: 8px 14px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  button:focus-visible, .filebtn:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.45; cursor: default; }
  .primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .solid { background: var(--ink); color: var(--bg); border-color: transparent; }
  .filebtn { position: relative; }
  .filebtn input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .grow { flex: 1 1 0; }

  video { width: 100%; max-height: 46vh; background: #000; border-radius: 10px; display: block; }

  .trim { display: flex; flex-direction: column; gap: 10px; }
  .trimline { display: grid; grid-template-columns: 3.2em 1fr 5.4em; gap: 10px; align-items: center; }
  .trimline label { font-size: 0.85rem; color: var(--muted); }
  .trimline output { text-align: right; font-size: 0.9rem; }
  input[type="range"] { width: 100%; accent-color: var(--accent); min-width: 0; }
  .hint { margin: 0; font-size: 0.84rem; color: var(--muted); }
  .hint.warn { color: var(--danger); }

  .timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .clip {
    display: grid; grid-template-columns: 1.6em 1fr auto; gap: 10px; align-items: center;
    padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); min-width: 0;
  }
  .clip.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .clip .num { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); text-align: center; }
  .clip .body { min-width: 0; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 4px; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; min-height: 0; font-weight: 400; border-radius: 6px; }
  .clip .name { font-size: 0.88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip .range { font-size: 0.78rem; color: var(--muted); }
  .bar { position: relative; height: 8px; border-radius: 4px; background: var(--trim); overflow: hidden; }
  .bar span { position: absolute; top: 0; bottom: 0; background: var(--keep); border-radius: 4px; }
  .clip .tools { display: flex; gap: 4px; }
  .clip .tools button { min-height: 40px; min-width: 40px; padding: 4px 8px; font-size: 0.85rem; }
  .ghost { opacity: 0.6; }
  .ghost .tools { visibility: hidden; }
  .tag { font-size: 0.72rem; letter-spacing: 0.08em; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-weight: 400; }

  .total { font-size: 0.9rem; color: var(--muted); }
  .total b { color: var(--ink); font-weight: 600; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 0.92rem; min-height: 44px; }
  .check input { width: 20px; height: 20px; accent-color: var(--accent); }

  .status { margin: 0; font-size: 0.9rem; color: var(--muted); }
  .status.error { color: var(--danger); font-weight: 500; }
  .status.ok { color: var(--ok); font-weight: 500; }
  .foot { margin: 0; color: var(--muted); font-size: 0.82rem; }
</style>

<div class="wrap">
  <header>
    <h1>クリップつなぎ</h1>
    <p class="lead">動画の不要な部分をカットして、複数のクリップを好きな順につなげて保存します。再エンコードしないので画質はそのままです。</p>
  </header>

  <section class="panel" id="editor" hidden aria-labelledby="editor-title">
    <div class="row spread">
      <h2 id="editor-title">クリップ <span id="ed-num" class="tc">1</span> を編集</h2>
      <span class="tc hint" id="ed-pos">00:00.00</span>
    </div>
    <video id="player" controls playsinline preload="metadata"></video>
    <div class="trim">
      <div class="trimline">
        <label for="in-range">開始</label>
        <input id="in-range" type="range" min="0" max="1" step="0.01" value="0">
        <output id="in-out" class="tc" for="in-range">00:00.00</output>
      </div>
      <div class="trimline">
        <label for="out-range">終了</label>
        <input id="out-range" type="range" min="0" max="1" step="0.01" value="1">
        <output id="out-out" class="tc" for="out-range">00:00.00</output>
      </div>
    </div>
    <div class="row">
      <button type="button" id="set-in" class="grow">開始をここに</button>
      <button type="button" id="set-out" class="grow">終了をここに</button>
    </div>
    <div class="row">
      <button type="button" id="split" class="grow">ここで分割</button>
      <button type="button" id="play-range" class="grow">範囲を再生</button>
    </div>
    <p class="hint" id="snap-hint">開始位置はキーフレーム（約 1 秒ごと）に合わせて決まります。</p>
  </section>

  <section class="panel" aria-labelledby="timeline-title">
    <div class="row spread">
      <h2 id="timeline-title">タイムライン</h2>
      <span class="total" id="total">合計 <b class="tc">00:00.00</b></span>
    </div>
    <ol class="timeline" id="timeline"></ol>
    <label class="filebtn primary" for="add">
      <span>クリップを追加</span>
      <input id="add" type="file" multiple>
    </label>
    <p class="status" id="add-status" role="status"></p>
  </section>

  <section class="panel" aria-labelledby="export-title">
    <h2 id="export-title">書き出し</h2>
    <label class="check" for="mute"><input id="mute" type="checkbox"> 音声を消す</label>
    <button type="button" id="export" class="solid" disabled>書き出す</button>
    <p class="status" id="export-status" role="status">クリップを追加すると書き出せます。</p>
    <div id="result" hidden>
      <div class="trim">
        <video id="result-video" controls playsinline></video>
        <button type="button" id="save" class="primary">保存する</button>
        <p class="status" id="save-status" role="status"></p>
      </div>
    </div>
  </section>

  <p class="foot">処理はすべてこの iPhone の中で行い、動画はどこにも送信しません。iPhone で撮った MOV / MP4 に対応しています。つなげるクリップは同じ形式・解像度・向きのものに限ります。</p>
</div>

<script>
/*ENGINE*/
</script>
<script>
  (function () {
    var E = window.ClipEngine;
    var $ = function (id) { return document.getElementById(id); };
    var player = $('player'), inRange = $('in-range'), outRange = $('out-range');
    var timeline = $('timeline');

    var segs = [];      // { id, clip, start, end }
    var selected = null;
    var nextId = 1;
    var result = null;  // { blob, url, name }
    var downloadsReady = window.claude && window.claude.use ? window.claude.use('downloads') : Promise.resolve(null);

    function tc(sec) {
      sec = Math.max(0, sec || 0);
      var m = Math.floor(sec / 60);
      var s = sec - m * 60;
      return String(m).padStart(2, '0') + ':' + s.toFixed(2).padStart(5, '0');
    }
    function say(el, text, kind) { el.textContent = text; el.className = 'status' + (kind ? ' ' + kind : ''); }
    function seg() { return segs.find(function (s) { return s.id === selected; }) || null; }
    function invalidate() {
      if (result) { URL.revokeObjectURL(result.url); result = null; }
      $('result').hidden = true;
      $('export').disabled = !segs.length;
      say($('export-status'), segs.length ? '準備ができたら「書き出す」を押してください。' : 'クリップを追加すると書き出せます。');
    }

    // ---------- タイムライン ----------
    function renderTimeline() {
      timeline.textContent = '';
      if (!segs.length) {
        [['IMG_0412.MOV', 0.08, 0.55, '00:01.00 – 00:06.50'], ['IMG_0415.MOV', 0.2, 0.9, '00:02.00 – 00:09.00']].forEach(function (ex, i) {
          var li = document.createElement('li');
          li.className = 'clip ghost';
          li.innerHTML = '<span class="num">' + (i + 1) + '</span><div class="body"><span class="name"></span><span class="range tc"></span><div class="bar"><span></span></div></div><div class="tools"><button type="button" tabindex="-1">↑</button></div>';
          li.querySelector('.name').textContent = ex[0] + '（例）';
          li.querySelector('.range').textContent = ex[3];
          var bar = li.querySelector('.bar span');
          bar.style.left = ex[1] * 100 + '%'; bar.style.width = (ex[2] - ex[1]) * 100 + '%';
          timeline.append(li);
        });
        $('total').innerHTML = '合計 <b class="tc">00:00.00</b>';
        return;
      }
      var total = 0;
      segs.forEach(function (s, i) {
        total += Math.max(0, s.end - s.start);
        var li = document.createElement('li');
        li.className = 'clip' + (s.id === selected ? ' selected' : '');

        var num = document.createElement('span');
        num.className = 'num'; num.textContent = i + 1;

        var body = document.createElement('button');
        body.type = 'button'; body.className = 'body';
        body.setAttribute('aria-label', (i + 1) + ' 番目のクリップを編集');
        var name = document.createElement('span'); name.className = 'name'; name.textContent = s.clip.name;
        var range = document.createElement('span'); range.className = 'range tc';
        range.textContent = tc(s.start) + ' – ' + tc(s.end) + '（' + tc(s.end - s.start) + '）';
        var bar = document.createElement('div'); bar.className = 'bar';
        var fill = document.createElement('span');
        fill.style.left = (s.start / s.clip.duration * 100) + '%';
        fill.style.width = (Math.max(0, s.end - s.start) / s.clip.duration * 100) + '%';
        bar.append(fill);
        body.append(name, range, bar);
        body.addEventListener('click', function () { select(s.id); });

        var tools = document.createElement('div'); tools.className = 'tools';
        tools.append(
          tool('↑', '前へ移動', i === 0, function () { move(i, -1); }),
          tool('↓', '後ろへ移動', i === segs.length - 1, function () { move(i, 1); }),
          tool('削除', 'このクリップを削除', false, function () { remove(s.id); })
        );
        li.append(num, body, tools);
        timeline.append(li);
      });
      $('total').innerHTML = '合計 <b class="tc">' + tc(total) + '</b>';
    }

    function tool(label, aria, disabled, fn) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = label; b.setAttribute('aria-label', aria); b.disabled = disabled;
      b.addEventListener('click', fn);
      return b;
    }

    function move(i, d) {
      var j = i + d;
      if (j < 0 || j >= segs.length) return;
      var t = segs[i]; segs[i] = segs[j]; segs[j] = t;
      invalidate(); renderTimeline(); renderEditor();
    }

    function remove(id) {
      var i = segs.findIndex(function (s) { return s.id === id; });
      if (i === -1) return;
      segs.splice(i, 1);
      if (selected === id) selected = segs.length ? segs[Math.min(i, segs.length - 1)].id : null;
      invalidate(); renderTimeline(); renderEditor(true);
    }

    function select(id) {
      selected = id;
      renderTimeline(); renderEditor(true);
    }

    // ---------- 編集パネル ----------
    var currentClip = null;
    function renderEditor(seek) {
      var s = seg();
      $('editor').hidden = !s;
      if (!s) { player.removeAttribute('src'); currentClip = null; return; }
      $('ed-num').textContent = segs.indexOf(s) + 1;
      if (currentClip !== s.clip) {
        currentClip = s.clip;
        player.src = s.clip.url;
        seek = true;
      }
      inRange.max = outRange.max = s.clip.duration.toFixed(2);
      inRange.value = s.start; outRange.value = s.end;
      $('in-out').textContent = tc(s.start);
      $('out-out').textContent = tc(s.end);
      if (seek) seekTo(s.start);
    }

    function seekTo(t) {
      try { player.currentTime = t; } catch (e) { /* 読み込み前は loadedmetadata で再試行 */ }
    }
    player.addEventListener('loadedmetadata', function () { var s = seg(); if (s) seekTo(s.start); });
    player.addEventListener('timeupdate', function () {
      $('ed-pos').textContent = tc(player.currentTime);
      if (rangeStop !== null && player.currentTime >= rangeStop) { player.pause(); rangeStop = null; }
    });

    function setStart(t) {
      var s = seg(); if (!s) return;
      var snapped = E.snapStart(s.clip, Math.min(t, s.end - 0.1));
      s.start = snapped;
      var hint = $('snap-hint');
      if (Math.abs(snapped - t) > 0.02) {
        hint.textContent = 'キーフレームに合わせて ' + tc(snapped) + ' からにしました（画質を落とさないため）。';
      } else {
        hint.textContent = '開始位置はキーフレーム（約 1 秒ごと）に合わせて決まります。';
      }
      invalidate(); renderTimeline(); renderEditor(); seekTo(snapped);
    }

    function setEnd(t) {
      var s = seg(); if (!s) return;
      s.end = Math.min(s.clip.duration, Math.max(t, s.start + 0.1));
      invalidate(); renderTimeline(); renderEditor(); seekTo(s.end);
    }

    inRange.addEventListener('input', function () { $('in-out').textContent = tc(+inRange.value); seekTo(+inRange.value); });
    inRange.addEventListener('change', function () { setStart(+inRange.value); });
    outRange.addEventListener('input', function () { $('out-out').textContent = tc(+outRange.value); seekTo(+outRange.value); });
    outRange.addEventListener('change', function () { setEnd(+outRange.value); });
    $('set-in').addEventListener('click', function () { setStart(player.currentTime); });
    $('set-out').addEventListener('click', function () { setEnd(player.currentTime); });

    var rangeStop = null;
    $('play-range').addEventListener('click', function () {
      var s = seg(); if (!s) return;
      seekTo(s.start); rangeStop = s.end;
      var p = player.play(); if (p && p.catch) p.catch(function () {});
    });

    $('split').addEventListener('click', function () {
      var s = seg(); if (!s) return;
      var t = player.currentTime;
      var hint = $('snap-hint');
      if (t <= s.start + 0.2 || t >= s.end - 0.2) {
        hint.textContent = '分割したい位置まで再生位置を動かしてから押してください。';
        hint.className = 'hint warn';
        return;
      }
      hint.className = 'hint';
      var second = { id: nextId++, clip: s.clip, start: E.snapStart(s.clip, t), end: s.end };
      s.end = t;
      segs.splice(segs.indexOf(s) + 1, 0, second);
      hint.textContent = '2 つに分けました。いらない方は「削除」で消せます。後半はキーフレームの ' + tc(second.start) + ' から始まります。';
      invalidate(); renderTimeline(); renderEditor();
    });

    // ---------- 追加 ----------
    $('add').addEventListener('change', async function (ev) {
      var files = Array.prototype.slice.call(ev.target.files || []);
      ev.target.value = '';
      if (!files.length) return;
      var st = $('add-status');
      var failed = [];
      for (var i = 0; i < files.length; i++) {
        say(st, '読み込み中… ' + files[i].name);
        try {
          var clip = await E.openClip(files[i]);
          clip.url = URL.createObjectURL(files[i]);
          var s = { id: nextId++, clip: clip, start: clip.firstTime, end: clip.duration };
          segs.push(s);
          if (selected === null) selected = s.id;
        } catch (e) {
          failed.push(files[i].name + '：' + (e && e.userFacing ? e.message : 'MP4 か MOV の動画を選んでください。'));
        }
      }
      if (failed.length) say(st, '読み込めなかったファイルがあります。' + failed.join(' / '), 'error');
      else say(st, files.length + ' 本のクリップを追加しました。タップすると編集できます。', 'ok');
      invalidate(); renderTimeline(); renderEditor(true);
    });

    $('mute').addEventListener('change', invalidate);

    // ---------- 書き出しと保存 ----------
    $('export').addEventListener('click', async function () {
      if (!segs.length) return;
      var btn = $('export'), st = $('export-status');
      btn.disabled = true;
      say(st, '書き出しています…');
      try {
        var r = await E.render(segs.map(function (s) { return { clip: s.clip, start: s.start, end: s.end }; }), { mute: $('mute').checked });
        var d = new Date();
        var stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '-' +
          String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
        if (result) URL.revokeObjectURL(result.url);
        result = { blob: r.blob, url: URL.createObjectURL(r.blob), name: '編集_' + stamp + '.mp4' };
        $('result-video').src = result.url;
        $('result').hidden = false;
        var size = r.blob.size < 1048576 ? (r.blob.size / 1024).toFixed(0) + ' KB' : (r.blob.size / 1048576).toFixed(1) + ' MB';
        var note = r.audio === 'dropped' ? '（音声の形式がそろっていないか、音声のないクリップがあるため、音声なしで書き出しました）' : '';
        say(st, '書き出しました：' + tc(r.duration) + '・' + size + note, r.audio === 'dropped' ? 'error' : 'ok');
        say($('save-status'), '');
      } catch (e) {
        say(st, e && e.userFacing ? e.message : '書き出しに失敗しました。クリップを確認してもう一度試してください。', 'error');
      } finally {
        btn.disabled = !segs.length;
      }
    });

    $('save').addEventListener('click', async function () {
      if (!result) return;
      var st = $('save-status');
      var downloads = await downloadsReady;
      if (!downloads) {
        var a = document.createElement('a');
        a.href = result.url; a.download = result.name;
        document.body.appendChild(a); a.click(); a.remove();
        say(st, '「' + result.name + '」を保存しました。', 'ok');
        return;
      }
      var btn = $('save');
      btn.disabled = true;
      say(st, '保存の確認を待っています…');
      try {
        await downloads.save({ filename: result.name, data: result.blob });
        say(st, '共有シートで「"ファイル"に保存」→ 保存先（Documents など）を選んでください。', 'ok');
      } catch (e) {
        var c = e && e.code;
        if (c === 'declined') say(st, '保存をキャンセルしました。');
        else if (c === 'rate_limited') say(st, '確認画面がすでに開いています。少し待ってから押してください。', 'error');
        else say(st, '保存できませんでした（' + (c || '不明なエラー') + '）。', 'error');
      } finally {
        btn.disabled = false;
      }
    });

    renderTimeline();
  })();
</script>
