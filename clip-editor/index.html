<title>クリップつなぎ</title>
<style>
  /* 編集台：上にプレビューとトリム、下に並び順のタイムライン、最後に書き出し。iPhone 縦持ち前提の一列 */
  :root {
    --bg: #eceff2;
    --panel: #ffffff;
    --ink: #161b22;
    --muted: #5d6673;
    --line: #d4dae1;
    --accent: #1f5fd1;
    --accent-ink: #ffffff;
    --keep: #1f5fd1;
    --keep-soft: #dde7fa;
    --trim: #c9d0d8;
    --danger: #b3261e;
    --ok: #1d7a46;
    --font-body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1318; --panel: #171c23; --ink: #e5e9ee; --muted: #9aa4b1; --line: #2a313b;
      --accent: #6b9cff; --accent-ink: #0c1220; --keep: #6b9cff; --keep-soft: #1c2a45; --trim: #2e3642;
      --danger: #ff8a80; --ok: #6fd39a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1318; --panel: #171c23; --ink: #e5e9ee; --muted: #9aa4b1; --line: #2a313b;
    --accent: #6b9cff; --accent-ink: #0c1220; --keep: #6b9cff; --keep-soft: #1c2a45; --trim: #2e3642;
    --danger: #ff8a80; --ok: #6fd39a; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
  .wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font-size: 1.5rem; text-wrap: balance; }
  .lead { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
  h2 { margin: 0; font-size: 0.95rem; font-weight: 700; }
  .tc { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .spread { justify-content: space-between; }

  button, .filebtn {
    appearance: none; font: inherit; font-size: 0.92rem; font-weight: 600; cursor: pointer;
    border-radius: 10px; min-height: 44px; padding: 8px 14px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  button:focus-visible, .filebtn:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.45; cursor: default; }
  .primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .solid { background: var(--ink); color: var(--bg); border-color: transparent; }
  .filebtn { position: relative; }
  .filebtn input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .grow { flex: 1 1 0; }

  video { width: 100%; max-height: 46vh; background: #000; border-radius: 10px; display: block; }

  .trim { display: flex; flex-direction: column; gap: 10px; }
  .trimline { display: grid; grid-template-columns: 3.2em 1fr 5.4em; gap: 10px; align-items: center; }
  .trimline label { font-size: 0.85rem; color: var(--muted); }
  .trimline output { text-align: right; font-size: 0.9rem; }
  input[type="range"] { width: 100%; accent-color: var(--accent); min-width: 0; }
  .hint { margin: 0; font-size: 0.84rem; color: var(--muted); }
  .hint.warn { color: var(--danger); }

  .timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .clip {
    display: grid; grid-template-columns: 1.6em 1fr auto; gap: 10px; align-items: center;
    padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); min-width: 0;
  }
  .clip.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .clip .num { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); text-align: center; }
  .clip .body { min-width: 0; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 4px; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; min-height: 0; font-weight: 400; border-radius: 6px; }
  .clip .name { font-size: 0.88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip .range { font-size: 0.78rem; color: var(--muted); }
  .bar { position: relative; height: 8px; border-radius: 4px; background: var(--trim); overflow: hidden; }
  .bar span { position: absolute; top: 0; bottom: 0; background: var(--keep); border-radius: 4px; }
  .clip .tools { display: flex; gap: 4px; }
  .clip .tools button { min-height: 40px; min-width: 40px; padding: 4px 8px; font-size: 0.85rem; }
  .ghost { opacity: 0.6; }
  .ghost .tools { visibility: hidden; }
  .tag { font-size: 0.72rem; letter-spacing: 0.08em; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-weight: 400; }

  .total { font-size: 0.9rem; color: var(--muted); }
  .total b { color: var(--ink); font-weight: 600; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 0.92rem; min-height: 44px; }
  .check input { width: 20px; height: 20px; accent-color: var(--accent); }

  .status { margin: 0; font-size: 0.9rem; color: var(--muted); }
  .status.error { color: var(--danger); font-weight: 500; }
  .status.ok { color: var(--ok); font-weight: 500; }
  .foot { margin: 0; color: var(--muted); font-size: 0.82rem; }
</style>

<div class="wrap">
  <header>
    <h1>クリップつなぎ</h1>
    <p class="lead">動画の不要な部分をカットして、複数のクリップを好きな順につなげて保存します。再エンコードしないので画質はそのままです。</p>
  </header>

  <section class="panel" id="editor" hidden aria-labelledby="editor-title">
    <div class="row spread">
      <h2 id="editor-title">クリップ <span id="ed-num" class="tc">1</span> を編集</h2>
      <span class="tc hint" id="ed-pos">00:00.00</span>
    </div>
    <video id="player" controls playsinline preload="metadata"></video>
    <div class="trim">
      <div class="trimline">
        <label for="in-range">開始</label>
        <input id="in-range" type="range" min="0" max="1" step="0.01" value="0">
        <output id="in-out" class="tc" for="in-range">00:00.00</output>
      </div>
      <div class="trimline">
        <label for="out-range">終了</label>
        <input id="out-range" type="range" min="0" max="1" step="0.01" value="1">
        <output id="out-out" class="tc" for="out-range">00:00.00</output>
      </div>
    </div>
    <div class="row">
      <button type="button" id="set-in" class="grow">開始をここに</button>
      <button type="button" id="set-out" class="grow">終了をここに</button>
    </div>
    <div class="row">
      <button type="button" id="split" class="grow">ここで分割</button>
      <button type="button" id="play-range" class="grow">範囲を再生</button>
    </div>
    <p class="hint" id="snap-hint">開始位置はキーフレーム（約 1 秒ごと）に合わせて決まります。</p>
  </section>

  <section class="panel" aria-labelledby="timeline-title">
    <div class="row spread">
      <h2 id="timeline-title">タイムライン</h2>
      <span class="total" id="total">合計 <b class="tc">00:00.00</b></span>
    </div>
    <ol class="timeline" id="timeline"></ol>
    <label class="filebtn primary" for="add">
      <span>クリップを追加</span>
      <input id="add" type="file" multiple>
    </label>
    <p class="status" id="add-status" role="status"></p>
  </section>

  <section class="panel" aria-labelledby="export-title">
    <h2 id="export-title">書き出し</h2>
    <label class="check" for="mute"><input id="mute" type="checkbox"> 音声を消す</label>
    <button type="button" id="export" class="solid" disabled>書き出す</button>
    <p class="status" id="export-status" role="status">クリップを追加すると書き出せます。</p>
    <div id="result" hidden>
      <div class="trim">
        <video id="result-video" controls playsinline></video>
        <button type="button" id="save" class="primary">保存する</button>
        <p class="status" id="save-status" role="status"></p>
      </div>
    </div>
  </section>

  <p class="foot">処理はすべてこの iPhone の中で行い、動画はどこにも送信しません。iPhone で撮った MOV / MP4 に対応しています。つなげるクリップは同じ形式・解像度・向きのものに限ります。</p>
</div>

<script>
// 動画のカットとつなぎ合わせ（再エンコードなし）。
// 各クリップの moov だけを読み込んでサンプル表を作り、選んだ範囲のサンプルを並べ直して
// 新しい moov を組み立てる。映像・音声データ本体は Blob.slice で元ファイルを参照するだけなので、
// メモリをほとんど使わず、画質も変わらない。
// 映像は再エンコードしないため、開始位置はキーフレーム（Iフレーム）に合わせる。
(function (root) {
  'use strict';

  var CONTAINERS = { moov: 1, trak: 1, mdia: 1, minf: 1, stbl: 1, edts: 1, dinf: 1, mvex: 1 };
  var MAX32 = 0xffffffff;
  var EPS = 1e-6;

  function fail(message) {
    var e = new Error(message);
    e.userFacing = true;
    throw e;
  }

  // ---------- 読み込み ----------

  function fourcc(bytes, at) {
    return String.fromCharCode(bytes[at], bytes[at + 1], bytes[at + 2], bytes[at + 3]);
  }

  async function readBytes(blob, start, end) {
    return new Uint8Array(await blob.slice(start, end).arrayBuffer());
  }

  async function scanTopLevel(blob) {
    var boxes = [];
    var pos = 0;
    var total = blob.size;
    while (pos + 8 <= total) {
      var h = await readBytes(blob, pos, Math.min(pos + 16, total));
      var dv = new DataView(h.buffer);
      var size = dv.getUint32(0);
      var type = fourcc(h, 4);
      var header = 8;
      if (size === 1) {
        if (h.length < 16) fail('ファイルの末尾が壊れています。');
        size = dv.getUint32(8) * 4294967296 + dv.getUint32(12);
        header = 16;
      } else if (size === 0) {
        size = total - pos;
      }
      if (size < header || pos + size > total) {
        if (type !== 'mdat') fail('ファイルが途中で切れているか、MP4/MOV 形式ではありません。');
        size = total - pos;
      }
      boxes.push({ type: type, start: pos, size: size, header: header });
      pos += size;
    }
    return boxes;
  }

  function parseTree(bytes, start, end) {
    var dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    var out = [];
    var pos = start;
    while (pos + 8 <= end) {
      var size = dv.getUint32(pos);
      var type = fourcc(bytes, pos + 4);
      var header = 8;
      if (size === 1) {
        size = dv.getUint32(pos + 8) * 4294967296 + dv.getUint32(pos + 12);
        header = 16;
      } else if (size === 0) {
        size = end - pos;
      }
      if (size < header || pos + size > end) fail('動画の情報部分（moov）が壊れています。');
      var box = { type: type, start: pos, size: size, header: header, bytes: bytes };
      if (CONTAINERS[type]) box.children = parseTree(bytes, pos + header, pos + size);
      out.push(box);
      pos += size;
    }
    return out;
  }

  function child(box, type) {
    if (!box || !box.children) return null;
    for (var i = 0; i < box.children.length; i++) if (box.children[i].type === type) return box.children[i];
    return null;
  }

  function payload(box) {
    return new DataView(box.bytes.buffer, box.bytes.byteOffset + box.start + box.header, box.size - box.header);
  }

  function u64(dv, at) {
    return dv.getUint32(at) * 4294967296 + dv.getUint32(at + 4);
  }

  function i64(dv, at) {
    return dv.getInt32(at) * 4294967296 + dv.getUint32(at + 4);
  }

  function parseTrack(trak) {
    var mdia = child(trak, 'mdia');
    var hdlrBox = child(mdia, 'hdlr');
    var mdhdBox = child(mdia, 'mdhd');
    var tkhdBox = child(trak, 'tkhd');
    var stbl = child(child(mdia, 'minf'), 'stbl');
    if (!hdlrBox || !mdhdBox || !tkhdBox || !stbl) return null;

    var kind = fourcc(new Uint8Array(payload(hdlrBox).buffer, payload(hdlrBox).byteOffset + 8, 4), 0);
    var mdhd = payload(mdhdBox);
    var mv = mdhd.getUint8(0);
    var timescale = mv === 1 ? mdhd.getUint32(20) : mdhd.getUint32(12);
    var lang = mv === 1 ? mdhd.getUint16(32) : mdhd.getUint16(20);

    var tkhd = payload(tkhdBox);
    var mOff = tkhd.getUint8(0) === 1 ? 52 : 40;
    var matrix = new Uint8Array(tkhd.buffer.slice(tkhd.byteOffset + mOff, tkhd.byteOffset + mOff + 36));
    var tkWidth = tkhd.getUint32(mOff + 36);
    var tkHeight = tkhd.getUint32(mOff + 40);

    // 編集リストの最初の有効な区間が、表示開始位置（メディア時間）
    var shift = 0;
    var elstBox = child(child(trak, 'edts'), 'elst');
    if (elstBox) {
      var el = payload(elstBox);
      var ev = el.getUint8(0);
      var en = el.getUint32(4);
      var at = 8;
      for (var e = 0; e < en; e++) {
        var mt = ev === 1 ? i64(el, at + 8) : el.getInt32(at + 4);
        at += ev === 1 ? 20 : 12;
        if (mt !== -1) { shift = mt; break; }
      }
    }

    // サンプル記述（コーデック設定）をそのまま保持する
    var stsdBox = child(stbl, 'stsd');
    if (!stsdBox) return null;
    var entries = [];
    var sp = stsdBox.start + stsdBox.header + 8;
    var sEnd = stsdBox.start + stsdBox.size;
    var sdv = new DataView(stsdBox.bytes.buffer, stsdBox.bytes.byteOffset);
    while (sp + 8 <= sEnd) {
      var esz = sdv.getUint32(sp);
      if (esz < 8 || sp + esz > sEnd) break;
      entries.push(stsdBox.bytes.slice(sp, sp + esz));
      sp += esz;
    }
    if (!entries.length) return null;

    // サンプルサイズ
    var count, size;
    var stsz = child(stbl, 'stsz');
    var stz2 = child(stbl, 'stz2');
    if (stsz) {
      var p = payload(stsz);
      var uniform = p.getUint32(4);
      count = p.getUint32(8);
      size = new Uint32Array(count);
      for (var i = 0; i < count; i++) size[i] = uniform || p.getUint32(12 + i * 4);
    } else if (stz2) {
      var q = payload(stz2);
      var field = q.getUint8(7);
      count = q.getUint32(8);
      size = new Uint32Array(count);
      for (var j = 0; j < count; j++) {
        if (field === 16) size[j] = q.getUint16(12 + j * 2);
        else if (field === 8) size[j] = q.getUint8(12 + j);
        else { var b = q.getUint8(12 + (j >> 1)); size[j] = j & 1 ? b & 15 : b >> 4; }
      }
    } else {
      return null;
    }

    // 再生時間（stts）
    var dur = new Uint32Array(count);
    var sttsBox = child(stbl, 'stts');
    if (sttsBox) {
      var st = payload(sttsBox);
      var sn = st.getUint32(4);
      var k = 0;
      for (var r = 0; r < sn && k < count; r++) {
        var c = st.getUint32(8 + r * 8), d = st.getUint32(12 + r * 8);
        for (var x = 0; x < c && k < count; x++) dur[k++] = d;
      }
    }

    // 表示時刻のずれ（ctts、Bフレームがある場合）
    var cto = new Int32Array(count);
    var cttsBox = child(stbl, 'ctts');
    if (cttsBox) {
      var ct = payload(cttsBox);
      var cn = ct.getUint32(4);
      var m = 0;
      for (var s = 0; s < cn && m < count; s++) {
        var cc = ct.getUint32(8 + s * 8), co = ct.getInt32(12 + s * 8);
        for (var y = 0; y < cc && m < count; y++) cto[m++] = co;
      }
    }

    // キーフレーム（stss が無ければ全サンプルがキーフレーム）
    var sync = new Uint8Array(count);
    var stssBox = child(stbl, 'stss');
    if (stssBox) {
      var ss = payload(stssBox);
      var sc = ss.getUint32(4);
      for (var t = 0; t < sc; t++) {
        var n1 = ss.getUint32(8 + t * 4);
        if (n1 >= 1 && n1 <= count) sync[n1 - 1] = 1;
      }
    } else {
      sync.fill(1);
    }

    // チャンク位置 → サンプルごとのファイル内位置
    var chunkOff = [];
    var stco = child(stbl, 'stco');
    var co64 = child(stbl, 'co64');
    if (stco) {
      var o = payload(stco);
      var on = o.getUint32(4);
      for (var z = 0; z < on; z++) chunkOff.push(o.getUint32(8 + z * 4));
    } else if (co64) {
      var o6 = payload(co64);
      var on6 = o6.getUint32(4);
      for (var z6 = 0; z6 < on6; z6++) chunkOff.push(u64(o6, 8 + z6 * 8));
    } else {
      return null;
    }
    var runs = [];
    var stscBox = child(stbl, 'stsc');
    if (stscBox) {
      var sc2 = payload(stscBox);
      var rn = sc2.getUint32(4);
      for (var w = 0; w < rn; w++) {
        runs.push({ first: sc2.getUint32(8 + w * 12), per: sc2.getUint32(12 + w * 12), desc: sc2.getUint32(16 + w * 12) });
      }
    }
    var offset = new Float64Array(count);
    var desc = new Uint16Array(count);
    var si = 0, ri = 0;
    for (var ch = 0; ch < chunkOff.length && si < count; ch++) {
      while (ri + 1 < runs.length && runs[ri + 1].first <= ch + 1) ri++;
      var run = runs[ri] || { per: 1, desc: 1 };
      var pos = chunkOff[ch];
      for (var u = 0; u < run.per && si < count; u++) {
        offset[si] = pos;
        desc[si] = Math.min(Math.max(run.desc - 1, 0), entries.length - 1);
        pos += size[si];
        si++;
      }
    }

    var dts = new Float64Array(count);
    var acc = 0;
    for (var v = 0; v < count; v++) { dts[v] = acc; acc += dur[v]; }

    var e0 = entries[0];
    var edv = new DataView(e0.buffer, e0.byteOffset, e0.byteLength);
    var info = {
      kind: kind, timescale: timescale, lang: lang, matrix: matrix, tkWidth: tkWidth, tkHeight: tkHeight,
      shift: shift, entries: entries, codec: fourcc(e0, 4), count: count, size: size, dur: dur, cto: cto,
      sync: sync, offset: offset, desc: desc, dts: dts, total: acc
    };
    if (kind === 'vide' && e0.length >= 36) { info.width = edv.getUint16(32); info.height = edv.getUint16(34); }
    if (kind === 'soun' && e0.length >= 28) { info.channels = edv.getUint16(24); }
    return info;
  }

  // [k, m) と [m, 次のキーフレーム) の表示時刻が重ならなければ、m で切っても表示に穴が空かない
  function cleanCut(T, k, m) {
    var maxIn = -Infinity, minOut = Infinity, i;
    for (i = k; i < m; i++) maxIn = Math.max(maxIn, T.dts[i] + T.cto[i]);
    for (i = m; i < T.count && (i === m || !T.sync[i]); i++) minOut = Math.min(minOut, T.dts[i] + T.cto[i]);
    return maxIn < minOut;
  }

  function pts(T, i) {
    return (T.dts[i] + T.cto[i] - T.shift) / T.timescale;
  }

  /** 動画ファイルを読み込み、編集に必要な情報を返す */
  async function openClip(file) {
    var top = await scanTopLevel(file);
    var moovInfo = null, ftypInfo = null;
    for (var i = 0; i < top.length; i++) {
      if (top[i].type === 'moov') moovInfo = top[i];
      if (top[i].type === 'ftyp' && !ftypInfo) ftypInfo = top[i];
      if (top[i].type === 'moof') fail('分割形式（fragmented MP4）の動画にはまだ対応していません。');
    }
    if (!moovInfo) fail('MP4/MOV の動画として読み込めませんでした。');
    var moovBytes = await readBytes(file, moovInfo.start, moovInfo.start + moovInfo.size);
    var moov = parseTree(moovBytes, 0, moovBytes.length)[0];
    var ftyp = ftypInfo ? await readBytes(file, ftypInfo.start, ftypInfo.start + ftypInfo.size) : null;

    var video = null, audio = null;
    moov.children.forEach(function (b) {
      if (b.type !== 'trak') return;
      var t = parseTrack(b);
      if (!t || !t.count) return;
      if (t.kind === 'vide' && !video) video = t;
      if (t.kind === 'soun' && !audio) audio = t;
    });
    if (!video) fail('映像が入っていない動画です。');

    var keyTimes = [];
    for (var k = 0; k < video.count; k++) if (video.sync[k]) keyTimes.push(pts(video, k));
    keyTimes.sort(function (a, b) { return a - b; });

    var first = keyTimes.length ? Math.max(0, keyTimes[0]) : 0;
    return {
      file: file,
      name: file.name || 'video',
      ftyp: ftyp,
      video: video,
      audio: audio,
      duration: video.total / video.timescale,
      firstTime: first,
      keyTimes: keyTimes
    };
  }

  /** 指定時刻以前で最も近いキーフレームの時刻（実際の開始位置） */
  function snapStart(clip, t) {
    var best = clip.keyTimes[0] || 0;

    function setStart(t) {
      var s = seg(); if (!s) return;
      var snapped = E.snapStart(s.clip, Math.min(t, s.end - 0.1));
      s.start = snapped;
      var hint = $('snap-hint');
      if (Math.abs(snapped - t) > 0.02) {
        hint.textContent = 'キーフレームに合わせて ' + tc(snapped) + ' からにしました（画質を落とさないため）。';
      } else {
        hint.textContent = '開始位置はキーフレーム（約 1 秒ごと）に合わせて決まります。';
      }
      invalidate(); renderTimeline(); renderEditor(); seekTo(snapped);
    }

    function setEnd(t) {
      var s = seg(); if (!s) return;
      s.end = Math.min(s.clip.duration, Math.max(t, s.start + 0.1));
      invalidate(); renderTimeline(); renderEditor(); seekTo(s.end);
    }

    inRange.addEventListener('input', function () { $('in-out').textContent = tc(+inRange.value); seekTo(+inRange.value); });
    inRange.addEventListener('change', function () { setStart(+inRange.value); });
    outRange.addEventListener('input', function () { $('out-out').textContent = tc(+outRange.value); seekTo(+outRange.value); });
    outRange.addEventListener('change', function () { setEnd(+outRange.value); });
    $('set-in').addEventListener('click', function () { setStart(player.currentTime); });
    $('set-out').addEventListener('click', function () { setEnd(player.currentTime); });

    var rangeStop = null;
    $('play-range').addEventListener('click', function () {
      var s = seg(); if (!s) return;
      seekTo(s.start); rangeStop = s.end;
      var p = player.play(); if (p && p.catch) p.catch(function () {});
    });

    $('split').addEventListener('click', function () {
      var s = seg(); if (!s) return;
      var t = player.currentTime;
      var hint = $('snap-hint');
      if (t <= s.start + 0.2 || t >= s.end - 0.2) {
        hint.textContent = '分割したい位置まで再生位置を動かしてから押してください。';
        hint.className = 'hint warn';
        return;
      }
      hint.className = 'hint';
      var second = { id: nextId++, clip: s.clip, start: E.snapStart(s.clip, t), end: s.end };
      s.end = t;
      segs.splice(segs.indexOf(s) + 1, 0, second);
      hint.textContent = '2 つに分けました。いらない方は「削除」で消せます。後半はキーフレームの ' + tc(second.start) + ' から始まります。';
      invalidate(); renderTimeline(); renderEditor();
    });

    // ---------- 追加 ----------
    $('add').addEventListener('change', async function (ev) {
      var files = Array.prototype.slice.call(ev.target.files || []);
      ev.target.value = '';
      if (!files.length) return;
      var st = $('add-status');
      var failed = [];
      for (var i = 0; i < files.length; i++) {
        say(st, '読み込み中… ' + files[i].name);
        try {
          var clip = await E.openClip(files[i]);
          clip.url = URL.createObjectURL(files[i]);
          var s = { id: nextId++, clip: clip, start: clip.firstTime, end: clip.duration };
          segs.push(s);
          if (selected === null) selected = s.id;
        } catch (e) {
          failed.push(files[i].name + '：' + (e && e.userFacing ? e.message : 'MP4 か MOV の動画を選んでください。'));
        }
      }
      if (failed.length) say(st, '読み込めなかったファイルがあります。' + failed.join(' / '), 'error');
      else say(st, files.length + ' 本のクリップを追加しました。タップすると編集できます。', 'ok');
      invalidate(); renderTimeline(); renderEditor(true);
    });

    $('mute').addEventListener('change', invalidate);

    // ---------- 書き出しと保存 ----------
    $('export').addEventListener('click', async function () {
      if (!segs.length) return;
      var btn = $('export'), st = $('export-status');
      btn.disabled = true;
      say(st, '書き出しています…');
      try {
        var r = await E.render(segs.map(function (s) { return { clip: s.clip, start: s.start, end: s.end }; }), { mute: $('mute').checked });
        var d = new Date();
        var stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '-' +
          String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
        if (result) URL.revokeObjectURL(result.url);
        result = { blob: r.blob, url: URL.createObjectURL(r.blob), name: '編集_' + stamp + '.mp4' };
        $('result-video').src = result.url;
        $('result').hidden = false;
        var size = r.blob.size < 1048576 ? (r.blob.size / 1024).toFixed(0) + ' KB' : (r.blob.size / 1048576).toFixed(1) + ' MB';
        var note = r.audio === 'dropped' ? '（音声の形式がそろっていないか、音声のないクリップがあるため、音声なしで書き出しました）' : '';
        say(st, '書き出しました：' + tc(r.duration) + '・' + size + note, r.audio === 'dropped' ? 'error' : 'ok');
        say($('save-status'), '');
      } catch (e) {
        say(st, e && e.userFacing ? e.message : '書き出しに失敗しました。クリップを確認してもう一度試してください。', 'error');
      } finally {
        btn.disabled = !segs.length;
      }
    });

    $('save').addEventListener('click', async function () {
      if (!result) return;
      var st = $('save-status');
      var downloads = await downloadsReady;
      if (!downloads) {
        var a = document.createElement('a');
        a.href = result.url; a.download = result.name;
        document.body.appendChild(a); a.click(); a.remove();
        say(st, '「' + result.name + '」を保存しました。', 'ok');
        return;
      }
      var btn = $('save');
      btn.disabled = true;
      say(st, '保存の確認を待っています…');
      try {
        await downloads.save({ filename: result.name, data: result.blob });
        say(st, '共有シートで「"ファイル"に保存」→ 保存先（Documents など）を選んでください。', 'ok');
      } catch (e) {
        var c = e && e.code;
        if (c === 'declined') say(st, '保存をキャンセルしました。');
        else if (c === 'rate_limited') say(st, '確認画面がすでに開いています。少し待ってから押してください。', 'error');
        else say(st, '保存できませんでした（' + (c || '不明なエラー') + '）。', 'error');
      } finally {
        btn.disabled = false;
      }
    });

    renderTimeline();
  })();
</script>
